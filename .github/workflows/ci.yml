name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Translations complete (every English text has a Dutch translation)
        run: python tools/check_translations.py

      - name: Build
        run: dotnet build ShivaAssist.slnx --configuration Release

      - name: Test
        run: dotnet test tests/ShivaAssist.Tests --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Windows uninstaller integration (disposable fixture only)
        shell: pwsh
        run: |
          dotnet publish tools/test-vm/UninstallerFixture -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o fixture-publish
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tools/test-vm/UninstallerChecks -c Release -- "$PWD/fixture-publish/ShivaUninstallFixture.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Publish for x64 and ARM64 (self-contained, single file)
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/ShivaAssist.App --configuration Release --runtime $rid --output "publish/$rid"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            dotnet publish src/ShivaAssist.Cli --configuration Release --runtime $rid --output "publish/$rid"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            dotnet publish src/ShivaAssist.Agent --configuration Release --runtime $rid --output "publish/$rid"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Remove-Item "publish/$rid/*.pdb" -ErrorAction SilentlyContinue
          }

      - name: Smoke test on the runner (read-only scan, report must validate)
        shell: pwsh
        run: |
          # Results and errors are written as annotations, which are readable without signing in.
          $output = & ./publish/win-x64/ShivaAssistCli.exe --plain --details --report scan.json 2>&1 | Out-String
          $exit = $LASTEXITCODE
          $output | Set-Content scan-output.txt
          Write-Output $output
          function Fail($message) {
            $tail = (($output -split "`r?`n") | Where-Object { $_ } | Select-Object -Last 12) -join '%0A'
            Write-Output "::error title=Smoke test::$message%0A$tail"
            exit 1
          }
          if ($exit -notin 0, 2) { Fail "ShivaAssistCli.exe exited with code $exit" }
          if (-not (Test-Path scan.json)) { Fail 'No report was written' }
          try { $report = Get-Content scan.json -Raw | ConvertFrom-Json } catch { Fail "Report is not valid JSON: $($_.Exception.Message)" }
          if ($report.schema -ne 'shiva.assist.report/1.0') { Fail "Wrong report schema: $($report.schema)" }
          if ($report.durationSeconds -gt 180) { Fail "Scan took $($report.durationSeconds) s (limit 180 s, AC-8)" }
          $summary = ($report.findings | ForEach-Object { "$($_.severity.PadRight(11)) $($_.id)  $($_.title)" }) -join '%0A'
          Write-Output "::notice title=Scan on windows-latest ($($report.durationSeconds) s)::$summary"
          # Exit code 2 only means the scan found warnings; the step itself succeeded.
          exit 0

      - name: SHA-256 for the release manifest on assist.shivacomputers.nl
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            Get-ChildItem "publish/$rid/*.exe" | ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              Set-Content "$($_.FullName).sha256" $hash
              Write-Output "::notice title=SHA-256 $rid/$($_.Name)::$hash"
            }
          }

      - uses: actions/upload-artifact@v5
        with:
          name: shiva-assist-win-x64
          path: |
            publish/win-x64/ShivaAssist.exe
            publish/win-x64/ShivaAssistCli.exe
            publish/win-x64/ShivaAssistAgent.exe
            publish/win-x64/*.sha256
            scan.json

      - uses: actions/upload-artifact@v5
        with:
          name: shiva-assist-win-arm64
          path: |
            publish/win-arm64/ShivaAssist.exe
            publish/win-arm64/ShivaAssistCli.exe
            publish/win-arm64/ShivaAssistAgent.exe
            publish/win-arm64/*.sha256

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: test-results
