name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Translations complete (every English text has a Dutch translation)
        run: python tools/check_translations.py

      - name: Build
        run: dotnet build ShivaAssist.slnx --configuration Release

      - name: Test
        run: dotnet test tests/ShivaAssist.Tests --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Publish ShivaAssist.exe (self-contained, single file)
        run: dotnet publish src/ShivaAssist.Cli --configuration Release --output publish

      - name: Smoke test on the runner (read-only scan, report must validate)
        shell: pwsh
        run: |
          # Results and errors are written as annotations, which are readable without signing in.
          $output = & ./publish/ShivaAssist.exe --plain --details --report scan.json 2>&1 | Out-String
          $exit = $LASTEXITCODE
          $output | Set-Content scan-output.txt
          Write-Output $output
          function Fail($message) {
            $tail = (($output -split "`r?`n") | Where-Object { $_ } | Select-Object -Last 12) -join '%0A'
            Write-Output "::error title=Smoke test::$message%0A$tail"
            exit 1
          }
          if ($exit -notin 0, 2) { Fail "ShivaAssist.exe exited with code $exit" }
          if (-not (Test-Path scan.json)) { Fail 'No report was written' }
          try { $report = Get-Content scan.json -Raw | ConvertFrom-Json } catch { Fail "Report is not valid JSON: $($_.Exception.Message)" }
          if ($report.schema -ne 'shiva.assist.report/1.0') { Fail "Wrong report schema: $($report.schema)" }
          if ($report.durationSeconds -gt 180) { Fail "Scan took $($report.durationSeconds) s (limit 180 s, AC-8)" }
          $summary = ($report.findings | ForEach-Object { "$($_.severity.PadRight(11)) $($_.id)  $($_.title)" }) -join '%0A'
          Write-Output "::notice title=Scan on windows-latest ($($report.durationSeconds) s)::$summary"
          # Exit code 2 only means the scan found warnings; the step itself succeeded.
          exit 0

      - name: SHA-256 for the release manifest on assist.shivacomputers.nl
        shell: pwsh
        run: (Get-FileHash publish/ShivaAssist.exe -Algorithm SHA256).Hash.ToLower() | Tee-Object publish/ShivaAssist.exe.sha256

      - uses: actions/upload-artifact@v5
        with:
          name: shiva-assist-win-x64
          path: |
            publish/ShivaAssist.exe
            publish/ShivaAssist.exe.sha256
            scan.json
            scan-output.txt

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: test-results
