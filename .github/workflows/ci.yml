name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build ShivaAssist.slnx --configuration Release

      - name: Test
        run: dotnet test tests/ShivaAssist.Tests --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Publish ShivaAssist.exe (self-contained, single file)
        run: dotnet publish src/ShivaAssist.Cli --configuration Release --output publish

      - name: Smoke test on the runner (read-only scan, report must validate)
        shell: pwsh
        run: |
          ./publish/ShivaAssist.exe --plain --report scan.json
          if ($LASTEXITCODE -notin 0, 2) { throw "Scan failed with exit code $LASTEXITCODE" }
          $report = Get-Content scan.json -Raw | ConvertFrom-Json
          if ($report.schema -ne 'shiva.assist.report/1.0') { throw 'Wrong report schema' }
          if ($report.durationSeconds -gt 180) { throw "Scan took $($report.durationSeconds) s (limit 180 s, AC-8)" }
          $report.findings | Format-Table id, severity, title -AutoSize

      - name: SHA-256 for the release manifest on assist.shivacomputers.nl
        shell: pwsh
        run: (Get-FileHash publish/ShivaAssist.exe -Algorithm SHA256).Hash.ToLower() | Tee-Object publish/ShivaAssist.exe.sha256

      - uses: actions/upload-artifact@v5
        with:
          name: shiva-assist-win-x64
          path: |
            publish/ShivaAssist.exe
            publish/ShivaAssist.exe.sha256
            scan.json

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: test-results
